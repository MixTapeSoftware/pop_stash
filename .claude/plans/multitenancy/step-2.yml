### 4. Create UserNotifier

**File**: `lib/pop_stash/accounts/user_notifier.ex`

```elixir
defmodule PopStash.Accounts.UserNotifier do
  import Swoosh.Email

  alias PopStash.Mailer

  defp deliver(recipient, subject, body) do
    email =
      new()
      |> to(recipient)
      |> from({"PopStash", "noreply@popstash.dev"})
      |> subject(subject)
      |> text_body(body)

    with {:ok, _metadata} <- Mailer.deliver(email) do
      {:ok, email}
    end
  end

  def deliver_login_instructions(user, url) do
    deliver(user.email, "Your PopStash login link", """
    Hi #{user.email},

    You requested a login link for PopStash.

    Click the link below to sign in:

    #{url}

    This link will expire in 1 hour.

    If you didn't request this link, you can safely ignore this email.
    """)
  end
end
```

### 5. Create Login LiveView

**File**: `lib/pop_stash_web/live/user_login_live.ex`

```elixir
defmodule PopStashWeb.UserLoginLive do
  use PopStashWeb, :live_view

  alias PopStash.Accounts

  def mount(_params, _session, socket) do
    email = Phoenix.Flash.get(socket.assigns.flash, :email)
    form = to_form(%{"email" => email}, as: "user")
    {:ok, assign(socket, form: form), temporary_assigns: [form: form]}
  end

  def handle_event("send_link", %{"user" => %{"email" => email}}, socket) do
    case Accounts.get_user_by_email(email) do
      nil ->
        # Don't reveal if user exists
        {:noreply,
         socket
         |> put_flash(:info, "If your email is registered, you'll receive a login link shortly.")
         |> assign(form: to_form(%{"email" => ""}, as: "user"))}

      user ->
        Accounts.deliver_user_login_instructions(
          user,
          &url(~p"/users/log-in/#{&1}")
        )

        {:noreply,
         socket
         |> put_flash(:info, "Login link sent to #{email}")
         |> assign(form: to_form(%{"email" => ""}, as: "user"))}
    end
  end

  def render(assigns) do
    ~H"""
    <div class="mx-auto max-w-sm">
      <.header class="text-center">
        Sign in to PopStash
        <:subtitle>
          We'll send a magic link to your email
        </:subtitle>
      </.header>

      <.simple_form for={@form} id="login_form" phx-submit="send_link">
        <.input field={@form[:email]} type="email" label="Email" required />
        <:actions>
          <.button phx-disable-with="Sending..." class="w-full">
            Send login link
          </.button>
        </:actions>
      </.simple_form>
    </div>
    """
  end
end
```

### 6. Update Session Controller

**File**: `lib/pop_stash_web/controllers/user_session_controller.ex`

Add token verification:

```elixir
def create(conn, %{"_action" => "verify_email_token", "token" => token}) do
  case Accounts.get_user_by_login_token(token) do
    {:ok, user} ->
      conn
      |> put_flash(:info, "Welcome back!")
      |> UserAuth.log_in_user(user)

    :error ->
      conn
      |> put_flash(:error, "Login link is invalid or expired.")
      |> redirect(to: ~p"/users/log-in")
  end
end
```

