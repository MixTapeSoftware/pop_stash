## Tests

**File**: `test/pop_stash_web/live/user_login_live_test.exs`

```elixir
defmodule PopStashWeb.UserLoginLiveTest do
  use PopStashWeb.ConnCase
  import Phoenix.LiveViewTest

  test "sends magic link on form submit", %{conn: conn} do
    user = insert(:user, email: "test@example.com")

    {:ok, lv, _html} = live(conn, ~p"/users/log-in")

    lv
    |> form("#login_form", user: %{email: "test@example.com"})
    |> render_submit()

    assert_email_sent(subject: "Your PopStash login link")
  end

  test "magic link logs user in", %{conn: conn} do
    user = insert(:user)
    {token, _} = Accounts.UserToken.build_email_token(user, "login")

    conn = get(conn, ~p"/users/log-in/#{token}")

    assert redirected_to(conn) == ~p"/"
    assert get_session(conn, :user_token)
  end
end
```

