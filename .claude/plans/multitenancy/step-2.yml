# Step 2: Passwordless Authentication

## Overview
Implement passwordless authentication using email magic links. Modify phx.gen.auth code to remove password field and implement token-based login.

## Context
phx.gen.auth generates password-based auth. We remove passwords and implement magic link tokens that expire in 1 hour.

## Implementation

### 1. Modify User Schema

**File**: `lib/pop_stash/accounts/user.ex`

```elixir
defmodule PopStash.Accounts.User do
  use PopStash.Schema
  import Ecto.Changeset

  alias PopStash.Organizations.Organization
  alias PopStash.Organizations.OrgMember

  schema "users" do
    field :email, :string
    field :confirmed_at, :utc_datetime_usec

    # Organization relationships
    belongs_to :selected_org, Organization
    has_many :org_members, OrgMember
    has_many :organizations, through: [:org_members, :organization]

    timestamps()
  end

  def registration_changeset(user, attrs, opts \\ []) do
    user
    |> cast(attrs, [:email])
    |> validate_email(opts)
  end

  def email_changeset(user, attrs, opts \\ []) do
    user
    |> cast(attrs, [:email])
    |> validate_email(opts)
  end

  defp validate_email(changeset, opts) do
    changeset
    |> validate_required([:email])
    |> validate_format(:email, ~r/^[^\s]+@[^\s]+$/, message: "must have @ sign and no spaces")
    |> validate_length(:email, max: 160)
    |> maybe_validate_unique_email(opts)
  end

  defp maybe_validate_unique_email(changeset, opts) do
    if Keyword.get(opts, :validate_email, true) do
      changeset
      |> unsafe_validate_unique(:email, PopStash.Repo)
      |> unique_constraint(:email)
    else
      changeset
    end
  end
end
```

### 2. Update Accounts Context for Magic Links

**File**: `lib/pop_stash/accounts.ex` (add to generated context)

```elixir
# Add to existing Accounts context

def deliver_user_login_instructions(user, login_url_fun) when is_function(login_url_fun, 1) do
  {encoded_token, user_token} = UserToken.build_email_token(user, "login")
  Repo.insert!(user_token)
  UserNotifier.deliver_login_instructions(user, login_url_fun.(encoded_token))
end

def get_user_by_login_token(token) do
  with {:ok, query} <- UserToken.verify_email_token_query(token, "login"),
       %User{} = user <- Repo.one(query) do
    Repo.delete_all(UserToken.token_and_context_query(token, "login"))
    {:ok, user}
  else
    _ -> :error
  end
end

def select_org(user, org_id) do
  user
  |> Ecto.Changeset.change(selected_org_id: org_id)
  |> Repo.update()
end
```

