## Verification

```bash
# Test in IEx
iex -S mix

# Setup: create user, org, project
{:ok, user} = PopStash.Accounts.register_user(%{email: "test@example.com"})
{:ok, org} = PopStash.Organizations.create("My Org", user.id)
{:ok, user} = PopStash.Accounts.select_org(user, org.id)
{:ok, scope} = PopStash.Scope.from_user(user)

# Test ProjectsDAL
{:ok, project} = PopStash.ProjectsDAL.create(scope, "Test Project")
assert project.org_id == org.id

projects = PopStash.ProjectsDAL.list(scope)
assert length(projects) == 1

# Test cross-org isolation
{:ok, other_org} = PopStash.Organizations.create("Other Org", user.id)
{:ok, other_project} = PopStash.Projects.create("Other Project", org_id: other_org.id)

# Should fail - wrong org
assert {:error, :unauthorized} = PopStash.ProjectsDAL.get(scope, other_project.id)
```

## Tests

**File**: `test/pop_stash/projects_dal_test.exs`

```elixir
defmodule PopStash.ProjectsDALTest do
  use PopStash.DataCase

  alias PopStash.ProjectsDAL
  alias PopStash.Scope

  setup do
    org1 = insert(:organization)
    org2 = insert(:organization)
    user = insert(:user, selected_org_id: org1.id)

    insert(:org_member, org_id: org1.id, user_id: user.id)

    scope = %Scope{org_id: org1.id, user_id: user.id, role: :member}

    {:ok, scope: scope, org1: org1, org2: org2}
  end

  test "cannot access projects from other orgs", %{scope: scope, org2: org2} do
    other_project = insert(:project, org_id: org2.id)

    assert {:error, :unauthorized} = ProjectsDAL.get(scope, other_project.id)
  end

  test "can create project in scoped org", %{scope: scope, org1: org1} do
    assert {:ok, project} = ProjectsDAL.create(scope, "Test")
    assert project.org_id == org1.id
  end

  test "can list only scoped org projects", %{scope: scope, org1: org1, org2: org2} do
    insert(:project, org_id: org1.id, name: "Org1 Project")
    insert(:project, org_id: org2.id, name: "Org2 Project")

    projects = ProjectsDAL.list(scope)

    assert length(projects) == 1
    assert hd(projects).name == "Org1 Project"
  end
end
```

