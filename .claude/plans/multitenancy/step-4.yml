# Step 4: DAL Layer

## Overview
Create Data Access Layer (DAL) modules that wrap existing contexts with org-scoped access control. These modules use the Scope from Step 3 to enforce org isolation.

## Context
DAL modules sit between LiveViews and contexts, enforcing org boundaries. Original contexts remain unchanged, maintaining backward compatibility.

## Implementation

### 1. Create ProjectsDAL

**File**: `lib/pop_stash/projects_dal.ex`

```elixir
defmodule PopStash.ProjectsDAL do
  @moduledoc """
  Data Access Layer for Projects with organization scoping.

  Wraps PopStash.Projects and enforces org-level access control.
  """

  import Ecto.Query

  alias PopStash.Projects.Project
  alias PopStash.Repo
  alias PopStash.Scope

  @doc """
  Validates that the current scope has access.
  """
  def validate_selected_org(%Scope{org_id: nil}), do: {:error, :no_org_selected}
  def validate_selected_org(%Scope{org_id: _}), do: :ok

  @doc """
  Creates a project within the scoped organization.
  """
  def create(%Scope{} = scope, name, opts \\ []) do
    with :ok <- validate_selected_org(scope) do
      attrs = %{
        name: name,
        description: Keyword.get(opts, :description),
        tags: Keyword.get(opts, :tags, []),
        org_id: scope.org_id
      }

      %Project{}
      |> Project.changeset(attrs)
      |> Repo.insert()
    end
  end

  @doc """
  Gets a project by ID, ensuring it belongs to the scoped org.
  """
  def get(%Scope{} = scope, id) do
    with :ok <- validate_selected_org(scope) do
      case Repo.get(Project, id) do
        nil ->
          {:error, :not_found}

        %Project{org_id: org_id} = project when org_id == scope.org_id ->
          {:ok, project}

        _ ->
          {:error, :unauthorized}
      end
    end
  end

  @doc """
  Lists all projects for the scoped organization.
  """
  def list(%Scope{} = scope) do
    with :ok <- validate_selected_org(scope) do
      Project
      |> where([p], p.org_id == ^scope.org_id)
      |> order_by([p], desc: :inserted_at)
      |> Repo.all()
    end
  end

  @doc """
  Updates a project, ensuring it belongs to the scoped org.
  """
  def update(%Scope{} = scope, id, attrs) do
    with :ok <- validate_selected_org(scope),
         {:ok, project} <- get(scope, id) do
      project
      |> Project.changeset(attrs)
      |> Repo.update()
    end
  end

  @doc """
  Deletes a project, ensuring it belongs to the scoped org.
  """
  def delete(%Scope{} = scope, id) do
    with :ok <- validate_selected_org(scope),
         {:ok, project} <- get(scope, id) do
      Repo.delete(project)
    end
  end
end
```

### 2. Create MemoryDAL

**File**: `lib/pop_stash/memory_dal.ex`

```elixir
defmodule PopStash.MemoryDAL do
  @moduledoc """
  Data Access Layer for Memory operations with organization scoping.

  Wraps PopStash.Memory and enforces org-level access control.
  """

  import Ecto.Query

  alias PopStash.Memory
  alias PopStash.Memory.Decision
  alias PopStash.Memory.Insight
  alias PopStash.Projects.Project
  alias PopStash.Repo
  alias PopStash.Scope

  def validate_selected_org(%Scope{org_id: nil}), do: {:error, :no_org_selected}
  def validate_selected_org(%Scope{org_id: _}), do: :ok

  ## Insights

  @doc """
  Creates an insight within the scoped organization.
  """
  def create_insight(%Scope{} = scope, project_id, body, opts \\ []) do
    with :ok <- validate_selected_org(scope),
         :ok <- validate_project_access(scope, project_id) do
      result = Memory.create_insight(project_id, body, opts)

      case result do
        {:ok, insight} ->
          insight
          |> Ecto.Changeset.change(org_id: scope.org_id)
          |> Repo.update()

        error -> error
      end
    end
  end

  @doc """
  Lists insights for the scoped organization.
  """
  def list_insights(%Scope{} = scope, project_id, opts \\ []) do
    with :ok <- validate_selected_org(scope),
         :ok <- validate_project_access(scope, project_id) do
      limit = Keyword.get(opts, :limit, 50)

      Insight
      |> where([i], i.org_id == ^scope.org_id and i.project_id == ^project_id)
      |> order_by(desc: :updated_at)
      |> limit(^limit)
      |> Repo.all()
    end
  end

  @doc """
  Gets an insight by ID, ensuring org access.
  """
  def get_insight(%Scope{} = scope, id) do
    with :ok <- validate_selected_org(scope) do
      case Repo.get(Insight, id) do
        nil -> {:error, :not_found}
        %Insight{org_id: org_id} = insight when org_id == scope.org_id -> {:ok, insight}
        _ -> {:error, :unauthorized}
      end
    end
  end

  ## Decisions

  @doc """
  Creates a decision within the scoped organization.
  """
  def create_decision(%Scope{} = scope, project_id, title, body, opts \\ []) do
    with :ok <- validate_selected_org(scope),
         :ok <- validate_project_access(scope, project_id) do
      result = Memory.create_decision(project_id, title, body, opts)

      case result do
        {:ok, decision} ->
          decision
          |> Ecto.Changeset.change(org_id: scope.org_id)
          |> Repo.update()

        error -> error
      end
    end
  end

  @doc """
  Lists decisions for the scoped organization.
  """
  def list_decisions(%Scope{} = scope, project_id, opts \\ []) do
    with :ok <- validate_selected_org(scope),
         :ok <- validate_project_access(scope, project_id) do
      limit = Keyword.get(opts, :limit, 50)

      Decision
      |> where([d], d.org_id == ^scope.org_id and d.project_id == ^project_id)
      |> order_by(desc: :inserted_at)
      |> limit(^limit)
      |> Repo.all()
    end
  end

  ## Helpers

  defp validate_project_access(%Scope{org_id: org_id}, project_id) do
    case Repo.get(Project, project_id) do
      nil -> {:error, :project_not_found}
      %{org_id: ^org_id} -> :ok
      _ -> {:error, :unauthorized}
    end
  end
end
```

### 3. Create ActivityDAL

**File**: `lib/pop_stash/activity_dal.ex`

```elixir
defmodule PopStash.ActivityDAL do
  @moduledoc """
  Data Access Layer for Activity feed with organization scoping.
  """

  import Ecto.Query

  alias PopStash.Memory.Decision
  alias PopStash.Memory.Insight
  alias PopStash.Memory.SearchLog
  alias PopStash.Repo
  alias PopStash.Scope

  def validate_selected_org(%Scope{org_id: nil}), do: {:error, :no_org_selected}
  def validate_selected_org(%Scope{org_id: _}), do: :ok

  @doc """
  Lists recent activity for the scoped organization.
  """
  def list_recent(%Scope{} = scope, opts \\ []) do
    with :ok <- validate_selected_org(scope) do
      limit = Keyword.get(opts, :limit, 20)
      project_id = Keyword.get(opts, :project_id)
      types = Keyword.get(opts, :types, [:decision, :insight, :search])

      items = []

      items = if :decision in types,
        do: items ++ fetch_decisions(scope.org_id, project_id, limit),
        else: items

      items = if :insight in types,
        do: items ++ fetch_insights(scope.org_id, project_id, limit),
        else: items

      items = if :search in types,
        do: items ++ fetch_searches(scope.org_id, project_id, limit),
        else: items

      items
      |> Enum.sort_by(& &1.inserted_at, {:desc, DateTime})
      |> Enum.take(limit)
    end
  end

  defp fetch_decisions(org_id, nil, limit) do
    Decision
    |> where([d], d.org_id == ^org_id)
    |> order_by(desc: :inserted_at)
    |> limit(^limit)
    |> preload(:project)
    |> Repo.all()
  end

  defp fetch_decisions(org_id, project_id, limit) do
    Decision
    |> where([d], d.org_id == ^org_id and d.project_id == ^project_id)
    |> order_by(desc: :inserted_at)
    |> limit(^limit)
    |> preload(:project)
    |> Repo.all()
  end

  defp fetch_insights(org_id, nil, limit) do
    Insight
    |> where([i], i.org_id == ^org_id)
    |> order_by(desc: :updated_at)
    |> limit(^limit)
    |> preload(:project)
    |> Repo.all()
  end

  defp fetch_insights(org_id, project_id, limit) do
    Insight
    |> where([i], i.org_id == ^org_id and i.project_id == ^project_id)
    |> order_by(desc: :updated_at)
    |> limit(^limit)
    |> preload(:project)
    |> Repo.all()
  end

  defp fetch_searches(org_id, nil, limit) do
    SearchLog
    |> where([s], s.org_id == ^org_id)
    |> order_by(desc: :inserted_at)
    |> limit(^limit)
    |> preload(:project)
    |> Repo.all()
  end

  defp fetch_searches(org_id, project_id, limit) do
    SearchLog
    |> where([s], s.org_id == ^org_id and s.project_id == ^project_id)
    |> order_by(desc: :inserted_at)
    |> limit(^limit)
    |> preload(:project)
    |> Repo.all()
  end
end
